<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Onboarding Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #05080f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* App Shell */
        .app-shell {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background: linear-gradient(180deg, #0a0e1a 0%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0, 100, 255, 0.1);
        }

        /* Header */
        .header {
            padding: 18px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            z-index: 20;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1a73e8, #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.4);
        }

        .header-info h1 {
            font-size: 1rem;
            font-weight: 600;
            color: white;
            letter-spacing: 0.3px;
        }

        .header-info .status {
            font-size: 0.7rem;
            color: #4ade80;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .progress-bar-container {
            padding: 0 20px;
            padding-top: 10px;
            padding-bottom: 6px;
            background: rgba(10, 14, 26, 0.95);
        }

        .progress-track {
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1a73e8, #8b5cf6, #ec4899);
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        .progress-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.35);
            text-align: right;
            margin-top: 4px;
            font-weight: 400;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 3px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        /* Messages */
        .message-row {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: msg-in 0.35s ease-out forwards;
            opacity: 0;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, #1a73e8, #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            letter-spacing: 0.2px;
        }

        .ai .msg-bubble {
            background: rgba(26, 115, 232, 0.08);
            border: 1px solid rgba(26, 115, 232, 0.2);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .user .msg-bubble {
            background: linear-gradient(135deg, #1a73e8, #1565c0);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3);
        }

        /* Options */
        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-left: 40px;
            margin-top: 4px;
            margin-bottom: 8px;
            animation: msg-in 0.4s ease-out forwards;
            opacity: 0;
        }

        .option-btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            color: #93c5fd;
            background: rgba(26, 115, 232, 0.08);
            border: 1px solid rgba(26, 115, 232, 0.25);
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .option-btn:hover {
            background: rgba(26, 115, 232, 0.2);
            border-color: rgba(26, 115, 232, 0.5);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2);
        }

        .option-btn:active {
            transform: scale(0.97);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding-left: 40px;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .typing-indicator.visible {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            background: rgba(26, 115, 232, 0.08);
            border: 1px solid rgba(26, 115, 232, 0.15);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: rgba(147, 197, 253, 0.6);
            border-radius: 50%;
            animation: bounce-dot 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce-dot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Bottom Input Panel */
        .input-panel {
            padding: 12px 16px 28px;
            background: rgba(10, 14, 26, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
        }

        .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a73e8, #1565c0);
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(26, 115, 232, 0.4);
            position: relative;
        }

        .mic-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(26, 115, 232, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 25px rgba(26, 115, 232, 0.6);
        }

        .mic-btn:hover::before {
            opacity: 1;
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 25px rgba(239, 68, 68, 0.6);
            animation: rec-pulse 1s infinite alternate;
        }

        .mic-btn.recording::before {
            opacity: 1;
            border-color: rgba(239, 68, 68, 0.4);
            animation: rec-ring 1.5s infinite;
        }

        @keyframes rec-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        @keyframes rec-ring {
            from { inset: -4px; opacity: 0.6; }
            to { inset: -14px; opacity: 0; }
        }

        .mic-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .input-field {
            flex: 1;
            height: 48px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 0 14px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            letter-spacing: 0.2px;
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.3);
            font-weight: 300;
        }

        .input-field:focus {
            border-color: rgba(26, 115, 232, 0.5);
            background: rgba(26, 115, 232, 0.06);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: rgba(26, 115, 232, 0.15);
            border-color: rgba(26, 115, 232, 0.4);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: rgba(255,255,255,0.5);
            transition: fill 0.2s;
        }

        .send-btn:hover svg {
            fill: #93c5fd;
        }

        /* Start Overlay */
        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 15, 0.97);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .start-overlay .logo {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, #1a73e8, #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            box-shadow: 0 10px 40px rgba(26, 115, 232, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .start-overlay h2 {
            color: white;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .start-overlay p {
            color: rgba(255,255,255,0.45);
            font-size: 0.85rem;
            text-align: center;
            max-width: 260px;
            line-height: 1.6;
        }

        .start-btn {
            padding: 14px 40px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1a73e8, #1565c0);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(26, 115, 232, 0.5);
            transition: all 0.25s;
            letter-spacing: 0.5px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(26, 115, 232, 0.7);
        }

        /* Completion Screen */
        .completion-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 15, 0.97);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .completion-screen.visible {
            display: flex;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4);
            animation: pop-in 0.5s ease-out;
        }

        @keyframes pop-in {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .completion-screen h2 {
            color: white;
            font-size: 1.3rem;
        }

        .completion-screen p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            text-align: center;
            max-width: 260px;
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- Start Overlay -->
    <div class="start-overlay" id="start-overlay">
        <div class="logo">🤖</div>
        <h2>AI Assistant</h2>
        <p>Your personal onboarding companion. Speak or type to get started!</p>
        <button class="start-btn" id="start-btn">Tap to Begin</button>
    </div>

    <!-- Completion Screen -->
    <div class="completion-screen" id="completion-screen">
        <div class="checkmark">✓</div>
        <h2>Setup Complete! 🎉</h2>
        <p>Your profile has been created. Redirecting you to the dashboard...</p>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="ai-avatar">🤖</div>
            <div class="header-info">
                <h1>AI Assistant</h1>
                <div class="status"><span class="status-dot"></span> Online</div>
            </div>
        </div>
    </div>

    <!-- Progress -->
    <div class="progress-bar-container">
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">Question 0 of 15</div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Input Panel -->
    <div class="input-panel">
        <button class="mic-btn" id="mic-btn">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <input type="text" class="input-field" id="text-input" placeholder="Speak or type..." disabled>
        <button class="send-btn" id="send-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

</div>

<script>
    // --- DOM Elements ---
    const chatArea = document.getElementById('chat-area');
    const textInput = document.getElementById('text-input');
    const micBtn = document.getElementById('mic-btn');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');

    const USER_ID = "user_" + Math.floor(Math.random() * 100000);
    const API_URL = "http://127.0.0.1:8000/api/chat";

    let isRecording = false;
    let recognition;
    let silenceTimer = null;
    let questionCount = 0;

    // --- Speech Recognition ---
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ta-IN';

        recognition.onresult = (event) => {
            let fullTranscript = '';
            for (let i = 0; i < event.results.length; i++) {
                fullTranscript += event.results[i][0].transcript;
            }
            textInput.value = fullTranscript;
            if (silenceTimer) clearTimeout(silenceTimer);
            silenceTimer = setTimeout(stopRecordingAndSend, 2000);
        };

        recognition.onerror = (event) => {
            console.error("Speech error:", event.error);
            isRecording = false;
            micBtn.classList.remove('recording');
            textInput.placeholder = "Speak or type...";
            if (silenceTimer) clearTimeout(silenceTimer);
        };

        recognition.onend = () => {
            if (isRecording) stopRecordingAndSend();
        };
    }

    function stopRecordingAndSend() {
        if (!isRecording) return;
        isRecording = false;
        recognition.stop();
        micBtn.classList.remove('recording');
        if (silenceTimer) clearTimeout(silenceTimer);

        if (textInput.value.trim() !== '') {
            sendMessage(textInput.value.trim());
        } else {
            textInput.placeholder = "Speak or type...";
        }
    }

    // --- Mic Button ---
    micBtn.addEventListener('click', () => {
        if (!recognition) {
            alert("Speech recognition not supported in this browser.");
            return;
        }
        if (isRecording) {
            stopRecordingAndSend();
        } else {
            textInput.value = "";
            textInput.placeholder = "Listening...";
            isRecording = true;
            micBtn.classList.add('recording');
            try { recognition.start(); } catch(e) {}
            if (silenceTimer) clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                if (isRecording && textInput.value.trim() === '') stopRecordingAndSend();
            }, 5000);
        }
    });

    // --- Send Button & Enter Key ---
    sendBtn.addEventListener('click', () => {
        if (textInput.value.trim() !== '') sendMessage(textInput.value.trim());
    });

    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && textInput.value.trim() !== '') {
            sendMessage(textInput.value.trim());
        }
    });

    // --- Add Message to Chat ---
    function addMessage(text, sender) {
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;

        if (sender === 'ai') {
            row.innerHTML = `
                <div class="msg-avatar">🤖</div>
                <div class="msg-bubble">${text}</div>
            `;
        } else {
            row.innerHTML = `
                <div class="msg-bubble">${text}</div>
            `;
        }

        // Insert before the typing indicator
        chatArea.insertBefore(row, typingIndicator);
        scrollToBottom();
    }

    function addOptions(options) {
        const row = document.createElement('div');
        row.className = 'options-row';
        row.id = 'current-options';

        options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.style.animationDelay = `${i * 0.08}s`;
            btn.onclick = () => {
                sendMessage(opt);
            };
            row.appendChild(btn);
        });

        chatArea.insertBefore(row, typingIndicator);
        scrollToBottom();
    }

    function removeOptions() {
        const existing = document.getElementById('current-options');
        if (existing) existing.remove();
    }

    function showTyping() {
        typingIndicator.classList.add('visible');
        scrollToBottom();
    }

    function hideTyping() {
        typingIndicator.classList.remove('visible');
    }

    function updateProgress() {
        questionCount++;
        const pct = Math.min((questionCount / 15) * 100, 100);
        progressFill.style.width = pct + '%';
        progressLabel.textContent = `Question ${questionCount} of 15`;
    }

    function scrollToBottom() {
        setTimeout(() => {
            chatArea.scrollTop = chatArea.scrollHeight;
        }, 50);
    }

    // --- Send Message to Backend ---
    async function sendMessage(message) {
        removeOptions();

        if (message !== "") {
            addMessage(message, 'user');
        }

        textInput.value = '';
        textInput.placeholder = "Agent is thinking...";
        textInput.disabled = true;

        showTyping();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: USER_ID, message: message })
            });

            const data = await response.json();

            hideTyping();
            textInput.disabled = false;
            textInput.placeholder = "Speak or type...";
            textInput.focus();

            if (data.status === "DONE" || data.status === "COMPLETED") {
                addMessage(data.text, 'ai');
                handleCompletion();
                return;
            }

            addMessage(data.text, 'ai');
            updateProgress();

            if (data.options && data.options.length > 0) {
                addOptions(data.options);
            }

        } catch (error) {
            hideTyping();
            console.error("Error:", error);
            addMessage("Connection lost. Please try again.", 'ai');
            textInput.disabled = false;
            textInput.placeholder = "Speak or type...";
        }
    }

    // --- Completion ---
    function handleCompletion() {
        progressFill.style.width = '100%';
        progressLabel.textContent = 'Complete! ✓';
        setTimeout(() => {
            document.getElementById('completion-screen').classList.add('visible');
        }, 2000);
    }

    // --- Start Button ---
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-overlay').style.display = 'none';
        textInput.disabled = false;
        sendMessage("");
    });
</script>
</body>
</html>
