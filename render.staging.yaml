# Optional example for a brand-new staging environment only.
services:
  - type: web
    name: swico-api-staging
    runtime: python
    plan: starter
    buildCommand: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
    preDeployCommand: cd backend && python -m alembic -c alembic.ini upgrade head
    startCommand: python backend/start_render.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: WEB_APP_ENABLED
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: BILLING_CHECKOUT_ENABLED
        value: "false"
      - key: BILLING_CREDIT_PERCENT
        value: "50"
      - key: USAGE_ESTIMATE_REFERENCE_PROVIDER
        value: openai
      - key: USAGE_ESTIMATE_REFERENCE_MODEL
        value: gpt-5-nano
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: swico-postgres-staging
          property: connectionString
  - type: web
    name: swico-web-staging
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: swico-postgres-staging
    plan: basic-256mb
