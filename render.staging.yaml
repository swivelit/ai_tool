# Render Blueprint for isolated staging resources only.
#
# Staging must use Razorpay Test Mode only. Never attach a production
# environment group, and never copy a production credential unintentionally.
# The dedicated staging account obtains credits through one supervised Test
# Mode transaction or another explicitly approved staging-only mechanism.
projects:
  - name: Swico Staging
    environments:
      - name: Staging
        services:
          - type: web
            name: swico-api-staging
            runtime: python
            region: singapore
            plan: starter
            buildCommand: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
            preDeployCommand: cd backend && python -m alembic -c alembic.ini upgrade head
            startCommand: python backend/start_render.py
            healthCheckPath: /api/web/health
            envVars:
              - key: APP_ENV
                value: staging
              - key: WEB_APP_ENABLED
                value: "true"
              - key: LOG_CHAT_CONTENT
                value: "false"
              - key: AUTH_ALLOW_DEV_TOKENS
                value: "false"
              - key: EMAIL_OTP_DEV_RETURN_CODE
                value: "false"
              - key: AUTO_CREATE_TABLES
                value: "false"
              - key: RUN_MIGRATIONS_ON_STARTUP
                value: "false"
              - key: REQUIRE_MIGRATIONS_BEFORE_STARTUP
                value: "false"
              # Change to true only in staging after every Test Mode value and
              # the public Test Mode badge have been verified.
              - key: BILLING_CHECKOUT_ENABLED
                value: "false"
              - key: BILLING_CREDIT_PERCENT
                value: "50"
              - key: RAZORPAY_MODE
                value: test
              - key: AI_PROVIDER_ROUTING_MODE
                value: openai_only
              - key: USAGE_ESTIMATE_REFERENCE_PROVIDER
                value: openai
              - key: USAGE_ESTIMATE_REFERENCE_MODEL
                value: gpt-5-nano
              - key: SENTRY_TRACES_SAMPLE_RATE
                value: "0.05"
              - key: SENTRY_PROFILES_SAMPLE_RATE
                value: "0"
              # Upload firebase-admin-staging.json as a secret file on this
              # service. Never reuse the production Firebase Admin file.
              - key: GOOGLE_APPLICATION_CREDENTIALS
                value: /etc/secrets/firebase-admin-staging.json
              - key: CORS_ALLOW_ORIGINS
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: RAZORPAY_KEY_ID
                sync: false
              - key: RAZORPAY_KEY_SECRET
                sync: false
              - key: RAZORPAY_WEBHOOK_SECRET
                sync: false
              - key: SENTRY_DSN
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: swico-postgres-staging
                  property: connectionString
          - type: web
            name: swico-web-staging
            runtime: static
            rootDir: web
            buildCommand: npm ci && npm run build
            staticPublishPath: ./dist
            envVars:
              - key: VITE_API_BASE_URL
                sync: false
              - key: VITE_FIREBASE_API_KEY
                sync: false
              - key: VITE_FIREBASE_AUTH_DOMAIN
                sync: false
              - key: VITE_FIREBASE_PROJECT_ID
                sync: false
              - key: VITE_FIREBASE_APP_ID
                sync: false
              - key: VITE_FIREBASE_MESSAGING_SENDER_ID
                sync: false
            headers:
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src https://*.firebaseapp.com https://*.razorpay.com https://api.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Permissions-Policy
                value: "camera=(), geolocation=(), microphone=()"
              - path: /*
                name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
        databases:
          - name: swico-postgres-staging
            region: singapore
            plan: basic-256mb
            ipAllowList: []
