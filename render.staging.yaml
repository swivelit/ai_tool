# Render Blueprint for isolated staging resources only.
#
# Staging must use Razorpay Test Mode only. Never attach a production
# environment group, and never copy a production credential unintentionally.
# The dedicated staging account obtains credits through one supervised Test
# Mode transaction or another explicitly approved staging-only mechanism.
projects:
  - name: Swico Staging
    environments:
      - name: Staging
        services:
          - type: web
            name: swico-api-staging
            runtime: python
            region: singapore
            plan: starter
            buildCommand: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
            preDeployCommand: cd backend && python -m alembic -c alembic.ini upgrade head
            startCommand: python backend/start_render.py
            healthCheckPath: /api/web/health
            envVars:
              - key: APP_ENV
                value: staging
              - key: WEB_APP_ENABLED
                value: "true"
              - key: WEB_TURN_OPTIMIZER_ENABLED
                value: "true"
              - key: WEB_TRIAG_ENABLED
                value: "false"
              - key: WEB_TRIAG_SHADOW_MODE
                value: "true"
              - key: WEB_TRIAG_POLICY_VERSION
                value: v1
              - key: WEB_TRIAG_RELEASE_STATE
                value: controlled
              - key: WEB_ROLLOUT_POLICY_VERSION
                value: v1
              - key: WEB_ROLLOUT_TRIAG_MODE
                value: disabled
              - key: WEB_ROLLOUT_TRIAG_PERCENT
                value: "0"
              - key: WEB_ROLLOUT_KNOWLEDGE_MODE
                value: disabled
              - key: WEB_ROLLOUT_KNOWLEDGE_PERCENT
                value: "0"
              - key: WEB_ROLLOUT_REPOSITORY_MODE
                value: disabled
              - key: WEB_ROLLOUT_REPOSITORY_PERCENT
                value: "0"
              - key: WEB_ROLLOUT_ANSWER_GUARD_MODE
                value: disabled
              - key: WEB_ROLLOUT_ANSWER_GUARD_PERCENT
                value: "0"
              - key: WEB_TRIAG_ROLLOUT_REPORT_ENABLED
                value: "false"
              - key: WEB_TRIAG_ROLLOUT_REPORT_DEFAULT_WINDOW_HOURS
                value: "24"
              - key: WEB_TRIAG_ROLLOUT_REPORT_MAX_WINDOW_HOURS
                value: "168"
              - key: WEB_TRIAG_ROLLOUT_ACCEPTANCE_MIN_SAMPLE
                value: "20"
              - key: WEB_RAG_HYBRID_ENABLED
                value: "false"
              - key: WEB_RAG_DENSE_ENABLED
                value: "false"
              - key: WEB_RAG_RETRIEVAL_EVALUATOR_ENABLED
                value: "false"
              - key: WEB_RAG_MAX_CORRECTIVE_ROUNDS
                value: "2"
              - key: WEB_RAG_QUERY_EMBEDDING_CACHE_TTL_SECONDS
                value: "86400"
              - key: WEB_RAG_EMBEDDING_MODEL
                value: text-embedding-3-small
              - key: WEB_RAG_EMBEDDING_DIMENSIONS
                value: "1536"
              - key: WEB_RAG_PERSISTENT_KNOWLEDGE_ENABLED
                value: "false"
              - key: WEB_RAG_TRIPLET_ENABLED
                value: "false"
              - key: WEB_RAG_HIERARCHY_ENABLED
                value: "false"
              - key: WEB_KNOWLEDGE_JOB_BATCH_SIZE
                value: "50"
              # When true, the API/shared worker excludes all four dedicated
              # knowledge job types. Keep false until the private worker is
              # enabled and its accounting gates pass.
              - key: WEB_KNOWLEDGE_WORKER_ENABLED
                value: "false"
              - key: WEB_KNOWLEDGE_WORKER_POLL_SECONDS
                value: "2"
              - key: WEB_KNOWLEDGE_WORKER_MAX_CONCURRENCY
                value: "1"
              - key: WEB_RAG_LITE_CANDIDATE_LIMIT
                value: "12"
              - key: WEB_RAG_LITE_EVIDENCE_ITEM_LIMIT
                value: "4"
              - key: WEB_RAG_LITE_EVIDENCE_TOKEN_CAP
                value: "1200"
              - key: WEB_RAG_STANDARD_CANDIDATE_LIMIT
                value: "30"
              - key: WEB_RAG_STANDARD_EVIDENCE_ITEM_LIMIT
                value: "7"
              - key: WEB_RAG_STANDARD_EVIDENCE_TOKEN_CAP
                value: "3200"
              - key: WEB_RAG_PRO_CANDIDATE_LIMIT
                value: "60"
              - key: WEB_RAG_PRO_EVIDENCE_ITEM_LIMIT
                value: "12"
              - key: WEB_RAG_PRO_EVIDENCE_TOKEN_CAP
                value: "6000"
              - key: WEB_ANSWER_GUARD_ENABLED
                value: "false"
              - key: WEB_VERIFIED_STREAMING_ENABLED
                value: "false"
              - key: WEB_ANSWER_GUARD_MODEL_VERIFIER_ENABLED
                value: "false"
              - key: WEB_ANSWER_GUARD_REPAIR_ENABLED
                value: "false"
              - key: WEB_ANSWER_GUARD_MAX_BUFFER_CHARACTERS
                value: "200000"
              - key: WEB_REPOSITORY_UPLOAD_ENABLED
                value: "false"
              - key: WEB_REPOSITORY_TTL_SECONDS
                value: "3600"
              - key: WEB_REPOSITORY_MAX_ARCHIVE_BYTES
                value: "26214400"
              - key: WEB_REPOSITORY_MAX_UNCOMPRESSED_BYTES
                value: "104857600"
              - key: WEB_REPOSITORY_MAX_FILES
                value: "5000"
              - key: WEB_REPOSITORY_MAX_COMPRESSION_RATIO
                value: "100"
              - key: WEB_REPOSITORY_RATE_LIMIT_PER_MINUTE
                value: "3"
              - key: WEB_RAG_REPOSITORY_INDEX_ENABLED
                value: "false"
              - key: WEB_PRO_CODE_VALIDATION_ENABLED
                value: "false"
              - key: WEB_CODE_VALIDATOR_URL
                value: http://swico-code-validator-staging:10001
              - key: WEB_CODE_VALIDATOR_AUTH_TOKEN
                fromService:
                  type: pserv
                  name: swico-code-validator-staging
                  envVarKey: CODE_VALIDATOR_AUTH_TOKEN
              - key: WEB_CODE_VALIDATOR_TIMEOUT_SECONDS
                value: "90"
              - key: WEB_SAME_THREAD_CONTEXT_MODE
                value: adaptive
              - key: WEB_SWICO_BRAND_GUARD_ENABLED
                value: "true"
              - key: WEB_CONTEXT_MAX_TURNS
                value: "2"
              - key: WEB_CONTEXT_MAX_CHARS
                value: "900"
              - key: WEB_PROFILE_PROMPT_MAX_CHARS
                value: "500"
              - key: WEB_SIMPLE_MAX_OUTPUT_TOKENS
                value: "220"
              - key: WEB_NORMAL_MAX_OUTPUT_TOKENS
                value: "420"
              - key: WEB_DETAILED_MAX_OUTPUT_TOKENS
                value: "1800"
              - key: WEB_LONG_FORM_MAX_OUTPUT_TOKENS
                value: "6000"
              - key: OPENAI_MAX_OUTPUT_TOKENS_HARD
                value: "6000"
              - key: OPENAI_REASONING_EFFORT_SIMPLE
                value: none
              - key: OPENAI_REASONING_EFFORT_NORMAL
                value: low
              - key: OPENAI_REASONING_EFFORT_DETAILED
                value: low
              - key: OPENAI_REASONING_EFFORT_LONG_FORM
                value: low
              - key: WEB_PROVIDER_CALLS_PER_TURN_MAX
                value: "1"
              - key: WEB_PROMPT_TOKEN_BREAKDOWN_ENABLED
                value: "true"
              - key: WEB_CACHE_BEFORE_BILLING_ENABLED
                value: "true"
              - key: WEB_PROMPT_CACHE_ENABLED
                value: "false"
              - key: WEB_PROMPT_CACHE_VERSION
                value: v1
              - key: WEB_MAX_PROVIDER_ATTEMPTS
                value: "1"
              - key: WEB_MESSAGE_EDIT_ENABLED
                value: "false"
              - key: WEB_CROSS_THREAD_MEMORY_ENABLED
                value: "false"
              - key: WEB_MEMORY_MAX_ITEMS
                value: "2"
              - key: WEB_MEMORY_MAX_CHARS
                value: "1200"
              - key: WEB_MEMORY_LLM_SUMMARIZATION_ENABLED
                value: "false"
              - key: WEB_LONG_INPUT_ENABLED
                value: "false"
              - key: WEB_LONG_INPUT_INLINE_THRESHOLD_CHARS
                value: "12000"
              - key: WEB_LONG_INPUT_MAX_CHARS
                value: "64000"
              - key: WEB_DOCUMENT_OCR_ENABLED
                value: "false"
              - key: WEB_LEGACY_DOC_CONVERSION_ENABLED
                value: "false"
              - key: WEB_ATTACHMENTS_ENABLED
                value: "true"
              - key: WEB_VOICE_RECORDING_ENABLED
                value: "true"
              - key: WEB_VOICE_REPLY_ENABLED
                value: "false"
              - key: WEB_VOICE_BILLING_ENABLED
                value: "false"
              - key: WEB_REALTIME_VOICE_ENABLED
                value: "false"
              - key: WEB_REALTIME_VOICE_PLAYBACK_MODE
                value: pcm_stream
              - key: WEB_REALTIME_VOICE_BACKCHANNEL_ENABLED
                value: "false"
              - key: WEB_SEPARATE_VOICE_CREDITS_ENABLED
                value: "false"
              - key: WEB_REALTIME_VOICE_SESSION_TICKET_TTL_SECONDS
                value: "60"
              - key: WEB_REALTIME_VOICE_MAX_SESSION_SECONDS
                value: "900"
              - key: WEB_REALTIME_VOICE_IDLE_TIMEOUT_SECONDS
                value: "60"
              - key: WEB_REALTIME_VOICE_MAX_CONCURRENT_SESSIONS_PER_USER
                value: "1"
              - key: WEB_REALTIME_VOICE_START_RATE_LIMIT_PER_MINUTE
                value: "5"
              - key: WEB_UPLOAD_TTL_SECONDS
                value: "300"
              - key: WEB_IMAGE_UPLOADS_ENABLED
                value: "true"
              - key: WEB_UPLOAD_MAX_FILE_BYTES
                value: "10485760"
              - key: WEB_UPLOAD_MAX_FILES_PER_MESSAGE
                value: "5"
              - key: WEB_UPLOAD_MAX_TOTAL_BYTES
                value: "26214400"
              - key: WEB_UPLOAD_MAX_EXTRACTED_CHARS
                value: "100000"
              - key: WEB_ATTACHMENT_PROMPT_MAX_CHARS
                value: "6000"
              - key: WEB_AUDIO_MAX_SECONDS
                value: "30"
              - key: WEB_STT_MODE
                value: "transcribe"
              - key: WEB_TTS_MAX_CHARACTERS
                value: "5000"
              - key: WEB_UPLOAD_RATE_LIMIT_PER_MINUTE
                value: "10"
              - key: WEB_STT_RATE_LIMIT_PER_MINUTE
                value: "10"
              - key: WEB_TTS_RATE_LIMIT_PER_MINUTE
                value: "10"
              - key: WEB_UPLOAD_STORE_RAW
                value: "false"
              - key: LOG_CHAT_CONTENT
                value: "false"
              - key: AUTH_ALLOW_DEV_TOKENS
                value: "false"
              - key: EMAIL_OTP_DEV_RETURN_CODE
                value: "false"
              - key: AUTO_CREATE_TABLES
                value: "false"
              - key: RUN_MIGRATIONS_ON_STARTUP
                value: "false"
              - key: REQUIRE_MIGRATIONS_BEFORE_STARTUP
                value: "false"
              # Change to true only in staging after every Test Mode value and
              # the public Test Mode badge have been verified.
              - key: BILLING_CHECKOUT_ENABLED
                value: "false"
              - key: BILLING_CREDIT_PERCENT
                value: "50"
              - key: RAZORPAY_MODE
                value: test
              - key: AI_PROVIDER_ROUTING_MODE
                value: openai_only
              - key: USAGE_ESTIMATE_REFERENCE_PROVIDER
                value: openai
              - key: USAGE_ESTIMATE_REFERENCE_MODEL
                value: gpt-5-nano
              - key: SENTRY_TRACES_SAMPLE_RATE
                value: "0.05"
              - key: SENTRY_PROFILES_SAMPLE_RATE
                value: "0"
              # Upload firebase-admin-staging.json as a secret file on this
              # service. Never reuse the production Firebase Admin file.
              - key: GOOGLE_APPLICATION_CREDENTIALS
                value: /etc/secrets/firebase-admin-staging.json
              - key: CORS_ALLOW_ORIGINS
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: RAZORPAY_KEY_ID
                sync: false
              - key: RAZORPAY_KEY_SECRET
                sync: false
              - key: RAZORPAY_WEBHOOK_SECRET
                sync: false
              - key: SENTRY_DSN
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: swico-postgres-staging
                  property: connectionString
              - key: WEB_UPLOAD_CACHE_URL
                fromService:
                  type: keyvalue
                  name: swico-upload-cache-staging
                  property: connectionString
          - type: keyvalue
            name: swico-upload-cache-staging
            region: singapore
            plan: starter
            ipAllowList: []
            maxmemoryPolicy: allkeys-lru
            persistenceMode: "off"
          - type: pserv
            name: swico-code-validator-staging
            runtime: python
            region: singapore
            plan: starter
            buildCommand: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
            startCommand: uvicorn app.code_validator.main:app --app-dir backend --host 0.0.0.0 --port 10001
            envVars:
              - key: CODE_VALIDATOR_AUTH_TOKEN
                generateValue: true
              - key: CODE_VALIDATOR_ISOLATION_PROOF
                value: static-only
              - key: CODE_VALIDATOR_NETWORK_ISOLATED
                value: "false"
              - key: CODE_VALIDATOR_TIMEOUT_SECONDS
                value: "90"
              - key: CODE_VALIDATOR_MAX_OUTPUT_BYTES
                value: "65536"
          - type: worker
            name: swico-knowledge-worker-staging
            runtime: python
            region: singapore
            plan: starter
            buildCommand: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
            startCommand: cd backend && python -m app.knowledge_worker
            envVars:
              - key: APP_ENV
                value: staging
              - key: WEB_KNOWLEDGE_WORKER_ENABLED
                value: "false"
              - key: WEB_KNOWLEDGE_WORKER_POLL_SECONDS
                value: "2"
              - key: WEB_KNOWLEDGE_WORKER_MAX_CONCURRENCY
                value: "1"
              - key: WEB_KNOWLEDGE_JOB_BATCH_SIZE
                value: "50"
              - key: WEB_RAG_PERSISTENT_KNOWLEDGE_ENABLED
                value: "false"
              - key: WEB_RAG_DENSE_ENABLED
                value: "false"
              - key: WEB_RAG_HIERARCHY_ENABLED
                value: "false"
              - key: WEB_RAG_TRIPLET_ENABLED
                value: "false"
              - key: WEB_RAG_EMBEDDING_MODEL
                value: text-embedding-3-small
              - key: WEB_RAG_EMBEDDING_DIMENSIONS
                value: "1536"
              - key: OPENAI_DAILY_BUDGET_USD
                value: "5"
              - key: OPENAI_BUDGET_SAFETY_MARGIN_RATIO
                value: "0.05"
              - key: OPENAI_PRICE_TEXT_EMBEDDING_3_SMALL_INPUT_PER_1M
                value: "0.02"
              - key: OPENAI_PRICE_TEXT_EMBEDDING_3_SMALL_OUTPUT_PER_1M
                value: "0"
              - key: USD_TO_INR_BILLING_RATE
                value: "90"
              - key: OPENAI_FX_BUFFER_PERCENT
                value: "3"
              - key: USAGE_MARKUP_MULTIPLIER
                value: "1.0"
              - key: BILLING_RESERVE_MULTIPLIER
                value: "1.25"
              - key: OPENAI_API_KEY
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: swico-postgres-staging
                  property: connectionString
          - type: web
            name: swico-web-staging
            runtime: static
            rootDir: web
            buildCommand: npm ci && npm run build
            staticPublishPath: ./dist
            envVars:
              - key: VITE_API_BASE_URL
                sync: false
              - key: VITE_FIREBASE_API_KEY
                sync: false
              - key: VITE_FIREBASE_AUTH_DOMAIN
                sync: false
              - key: VITE_FIREBASE_PROJECT_ID
                sync: false
              - key: VITE_FIREBASE_APP_ID
                sync: false
              - key: VITE_FIREBASE_MESSAGING_SENDER_ID
                sync: false
            headers:
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss:; frame-src https://*.firebaseapp.com https://*.razorpay.com https://api.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Permissions-Policy
                value: "camera=(), geolocation=(), microphone=(self)"
              - path: /*
                name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
        databases:
          - name: swico-postgres-staging
            region: singapore
            plan: basic-256mb
            ipAllowList: []
