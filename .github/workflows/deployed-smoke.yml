name: Deployed web smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: staging, production-readonly, production-triag, or production-capability
        required: true
        default: staging
        type: choice
        options: [staging, production-readonly, production-triag, production-capability]
      production_write_confirmation:
        description: Type I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION for production-triag
        required: false
        type: string
      production_capability_confirmation:
        description: Exact billable production-capability confirmation
        required: false
        type: string
      production_capability_batch:
        description: Capability benchmark batch
        required: false
        default: core
        type: choice
        options: [core, context, rag, repository, voice-ui, all]
      production_capability_max_chat_debit_micros:
        description: Positive maximum cumulative Chat debit in micro-INR
        required: false
        type: string
      production_capability_max_voice_debit_micros:
        description: Positive maximum cumulative Voice debit in micro-INR
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'production-triag' && 'production-triag-acceptance' || inputs.mode == 'production-capability' && 'production-capability-benchmark' || format('deployed-smoke-{0}', inputs.mode) }}
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.mode == 'production-capability' && 'production-triag' || inputs.mode }}
      deployment: false
    timeout-minutes: ${{ inputs.mode == 'production-capability' && 180 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.mode == 'production-capability'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate required environment secrets
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          missing=()
          for name in PLAYWRIGHT_BASE_URL E2E_TEST_EMAIL E2E_TEST_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required environment secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - name: Confirm production writes
        if: inputs.mode == 'production-triag'
        shell: bash
        env:
          PRODUCTION_WRITE_CONFIRMATION: ${{ inputs.production_write_confirmation }}
        run: |
          if [[ "$PRODUCTION_WRITE_CONFIRMATION" != 'I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION' ]]; then
            echo 'production-triag requires the exact production write confirmation' >&2
            exit 1
          fi
      - name: Confirm production capability benchmark
        if: inputs.mode == 'production-capability'
        shell: bash
        env:
          PRODUCTION_CAPABILITY_CONFIRMATION: ${{ inputs.production_capability_confirmation }}
          PRODUCTION_CAPABILITY_MAX_CHAT_DEBIT_MICROS: ${{ inputs.production_capability_max_chat_debit_micros }}
          PRODUCTION_CAPABILITY_MAX_VOICE_DEBIT_MICROS: ${{ inputs.production_capability_max_voice_debit_micros }}
        run: |
          if [[ "$PRODUCTION_CAPABILITY_CONFIRMATION" != 'I_UNDERSTAND_THIS_RUNS_BILLABLE_PRODUCTION_CAPABILITY_TESTS' ]]; then
            echo 'production-capability requires the exact billable capability confirmation' >&2
            exit 1
          fi
          for name in PRODUCTION_CAPABILITY_MAX_CHAT_DEBIT_MICROS PRODUCTION_CAPABILITY_MAX_VOICE_DEBIT_MICROS; do
            value=${!name:-}
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "$name must be a positive integer" >&2
              exit 1
            fi
          done
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install production capability Python test runtime
        if: inputs.mode == 'production-capability'
        run: python -m pip install pytest==9.0.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check deployed security headers
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
        run: python scripts/check-web-security-headers.py --url "$PLAYWRIGHT_BASE_URL"
      - name: Run selected deployed Playwright suite
        id: playwright
        shell: bash
        working-directory: web
        env:
          PLAYWRIGHT_MODE: ${{ inputs.mode }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_SECOND_TEST_EMAIL: ${{ secrets.E2E_SECOND_TEST_EMAIL }}
          E2E_SECOND_TEST_PASSWORD: ${{ secrets.E2E_SECOND_TEST_PASSWORD }}
          PRODUCTION_TRIAG_CONFIRMATION: ${{ inputs.production_write_confirmation }}
          PRODUCTION_CAPABILITY_CONFIRMATION: ${{ inputs.production_capability_confirmation }}
          PRODUCTION_CAPABILITY_BATCH: ${{ inputs.production_capability_batch }}
          PRODUCTION_CAPABILITY_MAX_CHAT_DEBIT_MICROS: ${{ inputs.production_capability_max_chat_debit_micros }}
          PRODUCTION_CAPABILITY_MAX_VOICE_DEBIT_MICROS: ${{ inputs.production_capability_max_voice_debit_micros }}
        run: |
          case "$PLAYWRIGHT_MODE" in
            staging) test_file='e2e/deployed-smoke.spec.ts' ;;
            production-readonly) test_file='e2e/deployed-readonly.spec.ts' ;;
            production-triag) test_file='e2e/production-triag.spec.ts' ;;
            production-capability) test_file='e2e/production-capability.spec.ts' ;;
            *) echo 'Unsupported deployed test mode' >&2; exit 2 ;;
          esac
          set +e
          if [[ "$PLAYWRIGHT_MODE" == 'production-triag' ]]; then
            npx playwright test "$test_file" --project=chromium --workers=1 --timeout=1200000
          elif [[ "$PLAYWRIGHT_MODE" == 'production-capability' ]]; then
            npx playwright test "$test_file" --project=chromium --workers=1 --timeout=10800000
          else
            npx playwright test "$test_file" --project=chromium --project=mobile-chromium
          fi
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then result=passed; else result=failed; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload private failure diagnostics
        if: failure() && inputs.mode != 'production-triag' && inputs.mode != 'production-capability'
        uses: actions/upload-artifact@v4
        with:
          name: deployed-playwright-failure-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload redacted production TRIAG trace on failure
        if: failure() && inputs.mode == 'production-triag'
        uses: actions/upload-artifact@v4
        with:
          name: production-triag-redacted-playwright-trace-${{ github.run_id }}
          path: web/test-results/production-triag-safe-trace.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload safe production TRIAG artifacts
        if: always() && inputs.mode == 'production-triag'
        uses: actions/upload-artifact@v4
        with:
          name: production-triag-safe-artifacts-${{ github.run_id }}
          path: |
            web/test-results/production-triag-screenshots
            web/test-results/production-triag-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload safe production capability summary
        if: always() && inputs.mode == 'production-capability'
        uses: actions/upload-artifact@v4
        with:
          name: production-capability-safe-summary-${{ github.run_id }}
          path: web/test-results/production-capability-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Write safe test summary
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          TEST_RESULT: ${{ steps.playwright.outputs.result }}
        run: |
          if [[ "$MODE" == 'production-capability' && -f web/test-results/production-capability-summary.json ]]; then
            parity_status=$(node -e "const summary=require('./web/test-results/production-capability-summary.json'); process.stdout.write(String(summary.deployment_parity_status || ''))")
            if [[ "$parity_status" == 'backend_release_mismatch' ]]; then
              node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const summary = require('./web/test-results/production-capability-summary.json')
          for (const [label, value] of [
            ['expected commit SHA', summary.expected_commit_sha],
            ['observed backend release', summary.observed_backend_release],
            ['deployment parity status', summary.deployment_parity_status],
            ['number of checks', summary.deployment_parity_checks],
            ['elapsed wait time (ms)', summary.deployment_parity_elapsed_wait_ms],
          ]) process.stdout.write(`- ${label}: ${String(value ?? 'unknown').slice(0, 160)}\n`)
          NODE
              exit 0
            fi
          fi
          hostname=$(node -e "try { process.stdout.write(new URL(process.env.BASE_URL).hostname) } catch { process.stdout.write('unavailable') }")
          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          result=${TEST_RESULT:-not-run}
          {
            echo "- mode: $MODE"
            echo "- base hostname: $hostname"
            echo "- commit SHA: $GITHUB_SHA"
            if [[ "$MODE" == 'production-triag' ]]; then
              echo "- Chromium desktop result: $result"
            elif [[ "$MODE" == 'production-capability' ]]; then
              echo "- Chromium serial capability result: $result"
            else
              echo "- desktop/mobile result: $result"
            fi
            echo "- timestamp: $timestamp"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MODE" == 'production-triag' && -f web/test-results/production-triag-summary.json ]]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const summary = require('./web/test-results/production-triag-summary.json')
          const preflight = summary.preflight || {}
          const cleanup = summary.cleanup || {}
          process.stdout.write('\n### Production TRIAG safe state\n\n')
          process.stdout.write(`- preflight: ${preflight.status || 'unknown'}\n`)
          process.stdout.write(`- preflight reason: ${preflight.reason_code || 'unknown'}\n`)
          process.stdout.write(`- backend release: ${summary.backend_release || 'unknown'}\n`)
          process.stdout.write(`- cleanup: ${cleanup.status || 'unknown'}\n`)
          const cleanupReasons = Array.isArray(cleanup.reason_codes) ? cleanup.reason_codes : []
          process.stdout.write(`- cleanup reasons: ${cleanupReasons.length ? cleanupReasons.join(', ') : 'none'}\n`)
          process.stdout.write('\n### Render log request IDs\n\n')
          const compactCounts = value => {
            if (!value || typeof value !== 'object' || Array.isArray(value)) return ''
            return Object.entries(value)
              .filter(([key, count]) => key && Number.isFinite(count))
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([key, count]) => `${key}=${count}`)
              .join('|')
          }
          for (const item of summary.scenarios || []) {
            const ids = Array.isArray(item.request_ids) ? item.request_ids : []
            const reason = item.reason_code || 'none'
            const subreason = item.subreason_code || 'none'
            const freshChatStrategy = item.fresh_chat_strategy || 'none'
            const freshChatReason = item.fresh_chat_reason_code || 'none'
            const prerequisite = item.prerequisite_reason_code || 'none'
            const fields = [
              `status=${item.status || 'unknown'}`,
              `reason=${reason}`,
              `subreason=${subreason}`,
              `fresh_chat_reason=${freshChatReason}`,
              `fresh_chat_strategy=${freshChatStrategy}`,
              `prerequisite=${prerequisite}`,
              `request_ids=${ids.length ? ids.join(', ') : 'none'}`,
            ]
            for (const name of [
              'selected_tier',
              'retrieval_status',
              'quality_status',
              'repository_validation_mode',
              'phase2_fallback_reason_code',
              'cancellation_attempt_http_result',
              'cancellation_response_status',
              'cancellation_observed_audit_state',
              'cancellation_failure_origin',
            ]) {
              if (item[name] !== undefined && item[name] !== null) {
                fields.push(`${name}=${item[name]}`)
              }
            }
            for (const name of [
              'source_kind_counts', 'answer_check_status_counts',
            ]) {
              const counts = compactCounts(item[name])
              if (counts) fields.push(`${name}=${counts}`)
            }
            process.stdout.write(`- ${item.scenario}: ${fields.join(', ')}\n`)
          }
          NODE
          fi
          if [[ "$MODE" == 'production-capability' && -f web/test-results/production-capability-summary.json ]]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const summary = require('./web/test-results/production-capability-summary.json')
          process.stdout.write('\n### Production capability safe summary\n\n')
          for (const [label, value] of [
            ['run ID', summary.run_id],
            ['backend release', summary.backend_release],
            ['batch', summary.batch],
            ['overall score', summary.overall_score],
            ['chat debit micros', summary.chat_debit_micros],
            ['voice debit micros', summary.voice_debit_micros],
            ['cleanup', summary.cleanup?.status],
          ]) process.stdout.write(`- ${label}: ${String(value ?? 'unknown').slice(0, 160)}\n`)
          process.stdout.write('\n### Scenario states\n\n')
          for (const item of summary.scenarios || []) {
            const ids = item.request_id ? item.request_id : 'none'
            process.stdout.write(`- ${item.scenario_id}: status=${item.status}, score=${item.score}, request_id=${ids}, reason=${(item.reason_codes || []).join('|')}\n`)
          }
          process.stdout.write('\n### Workflow states\n\n')
          for (const item of summary.workflows || []) {
            process.stdout.write(`- ${item.id}: status=${item.status}, request_ids=${(item.request_ids || []).join(',') || 'none'}, reason=${(item.reason_codes || []).join('|')}\n`)
          }
          NODE
          fi
