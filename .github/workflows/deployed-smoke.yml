name: Deployed web smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: staging or production-readonly
        required: true
        default: staging
        type: choice
        options: [staging, production-readonly]

jobs:
  playwright:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run deployed Playwright suite
        run: npx playwright test
        working-directory: web
        env:
          PLAYWRIGHT_MODE: ${{ inputs.mode }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-playwright-failure-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
