name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend tests and report slowest tests
        run: pytest -q --durations=25
        working-directory: backend

  backend-postgres-cli-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swico_test
          POSTGRES_PASSWORD: swico_test
          POSTGRES_DB: swico_cli_lifecycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swico_test -d swico_cli_lifecycle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: backend
      - name: Apply migrations to the disposable PostgreSQL database
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://swico_test@127.0.0.1:5432/swico_cli_lifecycle
          PGPASSWORD: swico_test
      - name: Run required PostgreSQL CLI lifecycle tests
        run: |
          set -o pipefail
          pytest -q tests/test_cli_postgres_lifecycle.py -rs | tee /tmp/swico-cli-postgres-tests.txt
          ! grep -Eq '[0-9]+ skipped|collected 0 items' /tmp/swico-cli-postgres-tests.txt
          grep -Eq '[0-9]+ passed' /tmp/swico-cli-postgres-tests.txt
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://swico_test@127.0.0.1:5432/swico_cli_lifecycle
          PGPASSWORD: swico_test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install production-capability Python test runtime
        run: python -m pip install pytest==9.0.3
      - name: Check public product language
        run: python scripts/check-web-product-language.py
      - name: Typecheck web application
        run: npm run typecheck
        working-directory: web
      - name: Lint web application
        run: npm run lint
        working-directory: web
      - name: Run web unit tests
        run: npm run test -- --run
        working-directory: web
      - name: Build production web application
        run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: https://api.example.test
          VITE_FIREBASE_API_KEY: ci-public-test-key
          VITE_FIREBASE_AUTH_DOMAIN: swico-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: swico-ci
          VITE_FIREBASE_APP_ID: 1:1234567890:web:abcdef123456
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli
      - name: Build and test CLI
        run: npm run typecheck && npm run lint && npm test
        working-directory: cli
      - name: Inspect local sandbox capability (fail-closed readiness only)
        run: node dist/cli.js sandbox status
        working-directory: cli
      - name: Run hostile sandbox verification or assert fail-closed capability
        run: node dist/cli.js sandbox verify --json --ci
        working-directory: cli
      - name: Run native Windows ConPTY helper acceptance
        if: runner.os == 'Windows'
        run: npm run test:conpty-native
        working-directory: cli
      - name: Build, pack, inspect, and install release artifact
        run: npm run release:check
        working-directory: cli

  cli-release-artifact:
    needs: [backend, backend-postgres-cli-lifecycle, web, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli
      - name: Run locked CLI validation
        run: npm run typecheck && npm run lint && npm test
        working-directory: cli
      - name: Build and accept canonical release artifact
        run: npm run release:check -- --keep-artifact
        working-directory: cli
      - name: Locate exactly the versioned artifact
        id: artifact
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mapfile -t artifacts < <(find . -maxdepth 1 -type f -name "swiveltechnologies-swico-${version}.tgz" -print)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one release artifact for ${version}, found ${#artifacts[@]}" >&2
            exit 1
          fi
          expected="swiveltechnologies-swico-${version}.tgz"
          artifact_filename="$(basename -- "${artifacts[0]}")"
          if [[ -z "${artifact_filename}" ||
                "${artifact_filename}" != "${expected}" ||
                "${artifact_filename}" == */* ||
                "${artifact_filename}" == *..* ||
                "${artifact_filename}" == *\\* ]]; then
            echo "Artifact locator did not produce the expected safe filename: ${artifact_filename}" >&2
            exit 1
          fi
          if [[ "${version}" == *-* ]]; then
            artifact_kind="release-candidate"
          else
            artifact_kind="release"
          fi
          echo "filename=${artifact_filename}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "kind=${artifact_kind}" >> "$GITHUB_OUTPUT"
      - name: Validate package allowlist and clean build identity
        working-directory: cli
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/swico-release-manifest.json
        run: node scripts/validate-release-artifact.mjs "${{ steps.artifact.outputs.filename }}" "$RELEASE_MANIFEST"
      - name: Stage the flat canonical release artifact
        id: canonical
        working-directory: cli
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/swico-release-manifest.json
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/swico-canonical-release"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "${{ steps.artifact.outputs.filename }}" "$stage/${{ steps.artifact.outputs.filename }}"
          cp "$RELEASE_MANIFEST" "$stage/swico-release-manifest.json"
          [[ "$(find "$stage" -type f | wc -l | tr -d ' ')" == 2 ]] || { echo "Canonical staging directory must contain exactly two files" >&2; exit 1; }
          [[ -f "$stage/${{ steps.artifact.outputs.filename }}" && -f "$stage/swico-release-manifest.json" ]] || { echo "Canonical staging files are missing" >&2; exit 1; }
      - name: Upload canonical release artifact
        uses: actions/upload-artifact@v7
        with:
          name: swico-cli-${{ steps.artifact.outputs.version }}-${{ steps.artifact.outputs.kind }}
          if-no-files-found: error
          path: ${{ runner.temp }}/swico-canonical-release/
