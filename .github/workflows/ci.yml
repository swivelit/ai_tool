name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend tests and report slowest tests
        run: pytest -q --durations=25
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install production-capability Python test runtime
        run: python -m pip install pytest==9.0.3
      - name: Check public product language
        run: python scripts/check-web-product-language.py
      - name: Typecheck web application
        run: npm run typecheck
        working-directory: web
      - name: Lint web application
        run: npm run lint
        working-directory: web
      - name: Run web unit tests
        run: npm run test -- --run
        working-directory: web
      - name: Build production web application
        run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: https://api.example.test
          VITE_FIREBASE_API_KEY: ci-public-test-key
          VITE_FIREBASE_AUTH_DOMAIN: swico-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: swico-ci
          VITE_FIREBASE_APP_ID: 1:1234567890:web:abcdef123456
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli
      - name: Build and test CLI
        run: npm test
        working-directory: cli
      - name: Build, pack, inspect, and install release artifact
        run: npm run release:check
        working-directory: cli
